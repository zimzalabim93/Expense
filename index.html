<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Expense Tracker</title>
    <!-- ตั้งค่า PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <!-- เรียกใช้ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex justify-center items-start pt-6 pb-12 px-4 font-sans text-gray-800">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-6">
        <h2 class="text-2xl font-bold text-center mb-6 text-indigo-600">บันทึกค่าใช้จ่ายเดินทาง</h2>

        <form id="expenseForm" class="space-y-4">
            <!-- วันที่ -->
            <div>
                <label class="block text-sm font-medium mb-1">วันที่</label>
                <input type="date" id="date" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- ชื่อร้านค้า / สถานที่ -->
            <div>
                <label class="block text-sm font-medium mb-1">ชื่อร้านค้า / บริการ</label>
                <input type="text" id="merchant" placeholder="เช่น ร้านอาหาร, ค่าตั๋วเครื่องบิน, ปั๊มน้ำมัน" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- หมวดหมู่ -->
            <div>
                <label class="block text-sm font-medium mb-1">หมวดหมู่</label>
                <select id="category" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none bg-white">
                    <option value="" disabled selected>เลือกหมวดหมู่...</option>
                    <option value="Food & Beverage">อาหารและเครื่องดื่ม</option>
                    <option value="Transportation">การเดินทาง (ตั๋ว, รถไฟ, แท็กซี่)</option>
                    <option value="Fuel">ค่าน้ำมัน</option>
                    <option value="Accommodation">ที่พัก</option>
                    <option value="Others">อื่นๆ</option>
                </select>
            </div>

            <!-- ยอดเงิน -->
            <div>
                <label class="block text-sm font-medium mb-1">จำนวนเงิน (บาท)</label>
                <input type="number" id="amount" step="0.01" placeholder="0.00" required class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>

            <!-- รายละเอียดเพิ่มเติม -->
            <div>
                <label class="block text-sm font-medium mb-1">รายละเอียดเพิ่มเติม (ถ้ามี)</label>
                <textarea id="description" rows="2" placeholder="คำอธิบาย..." class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
            </div>

            <!-- อัปโหลดสลิป -->
            <div>
                <label class="block text-sm font-medium mb-1">แนบรูปสลิป / ใบเสร็จ</label>
                <input type="file" id="slipImage" accept="image/*" class="w-full border border-gray-300 rounded-lg p-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
            </div>

            <!-- ปุ่มบันทึก -->
            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg mt-4 hover:bg-indigo-700 transition duration-200">
                บันทึกข้อมูล
            </button>
            
            <!-- ข้อความแสดงสถานะ -->
            <p id="statusMessage" class="text-center text-sm mt-2 hidden"></p>
        </form>
    </div>

    <script>
        // ==========================================
        // 1. ตั้งค่า API Keys และ URL ของคุณที่นี่
        // ==========================================
        const WEB_APP_URL = 'ใส่_WEB_APP_URL_จาก_APPS_SCRIPT_ที่นี่';
        const GEMINI_API_KEY = 'ใส่_API_KEY_จาก_GOOGLE_AI_STUDIO_ที่นี่';

        const statusMessage = document.getElementById('statusMessage');

        // ==========================================
        // 2. ระบบ AI สแกนสลิป (ทำงานเมื่อเลือกรูปภาพ)
        // ==========================================
        document.getElementById('slipImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            showStatus('กำลังใช้ AI สแกนสลิป...', 'text-blue-500');

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async function() {
                const base64Image = reader.result.split(',')[1];
                await extractSlipData(base64Image, file.type);
            };
        });

        async function extractSlipData(base64Image, mimeType) {
            if(!GEMINI_API_KEY || GEMINI_API_KEY.includes('ใส่_API_KEY')) {
                showStatus('กรุณาใส่ Gemini API Key ในโค้ดก่อนใช้งาน AI', 'text-amber-500');
                return;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
            const promptText = `Analyze this receipt/slip image. Extract the data and return ONLY a valid JSON object without any markdown wrapping. 
            Keys required: 
            - "merchant" (string, the name of the store or service)
            - "amount" (number, total amount paid)
            - "date" (string, date on receipt in YYYY-MM-DD format, if available)`;

            const payload = {
                contents: [{
                    parts: [
                        { text: promptText },
                        { inline_data: { mime_type: mimeType, data: base64Image } }
                    ]
                }]
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                let aiText = result.candidates[0].content.parts[0].text;
                aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                const extractedData = JSON.parse(aiText);

                if (extractedData.merchant) document.getElementById('merchant').value = extractedData.merchant;
                if (extractedData.amount) document.getElementById('amount').value = extractedData.amount;
                if (extractedData.date) document.getElementById('date').value = extractedData.date;

                showStatus('✨ AI สแกนสำเร็จ! โปรดตรวจสอบความถูกต้องก่อนบันทึก', 'text-green-600');
            } catch (error) {
                console.error("AI Error:", error);
                showStatus('ไม่สามารถสแกนสลิปได้ กรุณากรอกข้อมูลด้วยตนเอง', 'text-amber-500');
            }
        }

        // ==========================================
        // 3. ระบบส่งข้อมูลเข้า Google Sheet (ทำงานเมื่อกดบันทึก)
        // ==========================================
        document.getElementById('expenseForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            
            submitBtn.disabled = true;
            submitBtn.innerText = 'กำลังบันทึกข้อมูล...';
            submitBtn.classList.replace('bg-indigo-600', 'bg-gray-400');
            statusMessage.classList.add('hidden');

            const payload = {
                date: document.getElementById('date').value,
                merchant: document.getElementById('merchant').value,
                category: document.getElementById('category').value,
                amount: document.getElementById('amount').value,
                description: document.getElementById('description').value,
                imageBase64: '',
                mimeType: '',
                filename: ''
            };

            const fileInput = document.getElementById('slipImage');
            
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                payload.mimeType = file.type;
                payload.filename = file.name;
                
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = async function() {
                    payload.imageBase64 = reader.result;
                    await sendData(payload, submitBtn);
                };
                reader.onerror = function() {
                    showStatus('เกิดข้อผิดพลาดในการอ่านไฟล์รูปภาพ', 'text-red-500');
                    resetButton(submitBtn);
                };
            } else {
                await sendData(payload, submitBtn);
            }
        });

        async function sendData(payload, submitBtn) {
            try {
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                
                const result = await response.json();
                
                if (result.status === 'success') {
                    showStatus('บันทึกข้อมูลเรียบร้อยแล้ว!', 'text-green-600');
                    document.getElementById('expenseForm').reset();
                } else {
                    showStatus('Error: ' + result.message, 'text-red-500');
                }
            } catch (error) {
                showStatus('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาลองใหม่', 'text-red-500');
            } finally {
                resetButton(submitBtn);
            }
        }

        // ==========================================
        // 4. ฟังก์ชันช่วยเหลือ (UI)
        // ==========================================
        function showStatus(text, colorClass) {
            statusMessage.innerText = text;
            statusMessage.className = `text-center text-sm mt-2 font-medium ${colorClass}`;
            statusMessage.classList.remove('hidden');
        }

        function resetButton(btn) {
            btn.disabled = false;
            btn.innerText = 'บันทึกข้อมูล';
            btn.classList.replace('bg-gray-400', 'bg-indigo-600');
        }
    </script>
</body>
</html>
